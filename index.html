<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaklear — See pronunciation in your script</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f14;--surface:#111820;--card-bg:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  --card-border:rgba(255,255,255,.07);--text:#eae8e4;--muted:#8b929c;--dim:#787f8a;
  --accent:#12c48c;--accent-soft:#12c48c18;--accent-glow:#12c48c30;
  --warm:#e89b4e;--warm-soft:#e89b4e15;--blue:#4b8ef5;--blue-soft:#4b8ef515;
  --purple:#9875f5;--purple-soft:#9875f515;--red:#e85454;--red-soft:#e8545415;
  --dev:#44dfaa;
}
body{background:var(--bg);color:var(--text);font-family:'Outfit','Noto Sans Devanagari',sans-serif;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;transition:all .2s}
button:hover{filter:brightness(1.1)}
button:focus-visible,.bucket:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus{outline:none;border-color:var(--accent)!important}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:2px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.04);position:sticky;top:0;background:var(--bg);z-index:50}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0ea87a);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;position:relative}
.logo-text{font-size:14px;font-weight:700;letter-spacing:-.02em}.logo-text span{color:var(--accent)}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:.02em}
.nav-btn{padding:5px 12px;border-radius:8px;border:none;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:transparent;color:var(--muted)}
.nav-btn.active{background:rgba(255,255,255,.08);color:#fff}

/* Progress bar */
.progress-dots{display:flex;gap:3px}
.progress-dot{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.05);transition:background .3s}
.progress-dot.done{background:var(--accent)}.progress-dot.current{background:var(--dev)}
.progress-dot.study-done{background:var(--blue)}.progress-dot.study-current{background:#60a5fa}

/* Card */
.sort-card{background:var(--card-bg),var(--surface);border:1px solid var(--card-border);border-radius:22px;padding:32px 28px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.25);touch-action:none;user-select:none;cursor:grab;position:relative}
.sort-card:active{cursor:grabbing}
.drag-handle{width:36px;height:4px;border-radius:2px;margin:0 auto 26px;background:rgba(255,255,255,.08)}
.sort-word{font-size:clamp(26px,9vw,42px);overflow-wrap:anywhere;font-weight:800;color:#f9fafb;letter-spacing:-.03em;line-height:1}
.sort-hint{font-size:13px;color:var(--muted);margin-top:14px}

/* Buckets */
.buckets-grid{position:relative;z-index:110;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.bucket{padding:12px 2px 10px;border-radius:14px;border:2px dashed;text-align:center;cursor:pointer;font-family:inherit;color:inherit;min-width:0;transition:all .2s cubic-bezier(.2,.8,.2,1)}
.bucket-emoji,.bucket-label,.bucket-interval,.bucket-key{display:block}
.bucket-emoji{font-size:20px;margin-bottom:2px}
.bucket.hover{border-style:solid;transform:scale(1.12);background-color:var(--surface)!important}
.bucket-key{font-size:10px;color:var(--dim);margin-top:3px;font-family:'JetBrains Mono',monospace}
@media (hover:none){.bucket-key{display:none}}
.bucket-label{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bucket-interval{font-size:10px;color:var(--dim);margin-top:2px}
@media (max-width:359px){.bucket-label{text-transform:none;letter-spacing:0;font-size:10.5px}.bucket{border-width:1.5px}}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(11,15,20,.95);border-radius:12px;padding:8px 18px;z-index:200;font-size:12px;color:#d1d5db;box-shadow:0 6px 25px rgba(0,0,0,.5);animation:toastIn .25s ease;pointer-events:none}

/* Home */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.stat-card{padding:14px 10px;border-radius:14px;background:var(--surface);border:1px solid rgba(255,255,255,.04);text-align:center}
.stat-val{font-size:24px;font-weight:800;font-family:'Outfit'}.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.bucket-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid rgba(255,255,255,.04);margin-bottom:6px}
.bucket-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.word-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:28px}
.word-tag{padding:5px 11px;border-radius:10px;font-size:11px;font-weight:600;color:#d1d5db;display:flex;align-items:center;gap:5px}
.word-tag-dev{font-size:11px;font-family:'Noto Sans Devanagari';color:var(--dev);opacity:.7}
.btn-primary{padding:14px 28px;border-radius:12px;width:100%;background:linear-gradient(135deg,var(--accent),#0ea87a);color:#fff;border:none;font-size:15px;font-weight:700;letter-spacing:-.01em;box-shadow:0 4px 20px var(--accent-glow)}
.btn-secondary{padding:11px 28px;border-radius:12px;width:100%;background:transparent;border:1px solid rgba(255,255,255,.08);color:var(--muted);font-size:13px;font-weight:500}

/* Study cards */
.study-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:18px;padding:22px 24px;min-height:180px}
.study-tag{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:700;display:inline-block;margin-bottom:14px;letter-spacing:.03em;text-transform:uppercase}
.study-word{font-size:30px;font-weight:700;color:#f9fafb;margin-bottom:6px;letter-spacing:-.02em}
.reveal-btn{padding:10px 0;border-radius:10px;border:1px dashed rgba(255,255,255,.1);background:rgba(255,255,255,.02);color:var(--muted);font-size:12px;width:100%;transition:all .2s}
.action-btn{padding:9px 20px;border-radius:10px;border:1px solid;font-size:12px;font-weight:600;flex:1}
.note-box{padding:7px 11px;border-radius:8px;background:var(--warm-soft);border:1px solid #e89b4e18;font-size:11px;color:var(--warm);line-height:1.4}
.lang-label{font-size:11px;color:var(--muted);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.ipa{font-family:'JetBrains Mono',monospace;color:#9ca3af}.stress{font-family:'JetBrains Mono',monospace;color:var(--warm);font-weight:600}
.devanagari{font-family:'Noto Sans Devanagari',sans-serif;font-weight:600;color:var(--dev)}

/* Drop zone overlay */
.drop-overlay{position:fixed;bottom:0;left:0;right:0;height:200px;background:linear-gradient(to top,rgba(0,0,0,.4),transparent);pointer-events:none;z-index:5;opacity:0;transition:opacity .15s}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.fade-in{animation:fadeIn .3s ease}.slide-up{animation:slideUp .3s ease}.card-in{animation:cardIn .35s ease}
</style>
</head>

const BUCKETS = [
  {id:1,label:"Known",short:"Known",sub:"Monthly review",color:"#12c48c",emoji:"✓",interval:"30 days"},
  {id:2,label:"Pronunciation",short:"Say",sub:"Hesitant to speak",color:"#e89b4e",emoji:"🗣",interval:"7 days"},
  {id:3,label:"Spelling",short:"Spell",sub:"Can write it",color:"#4b8ef5",emoji:"✍",interval:"14 days"},
  {id:4,label:"Guessing",short:"Unsure",sub:"Not mastered",color:"#9875f5",emoji:"🤔",interval:"3 days"},
  {id:5,label:"Unknown",short:"New",sub:"Need to learn",color:"#e85454",emoji:"?",interval:"Daily"},
];
// Sort screen shows buckets from least to best known; keys 1–5 follow this order
const SORT_ORDER = [5,4,2,3,1].map(id=>BUCKETS.find(b=>b.id===id));
const SORT_HINT = "Drag into a bucket · Throw it · Tap or press 1–5";

const CATS = ["All","Robotics & Production","Job Interview & Career","Coding & Web Development","Daily Life in Japan","Travel & Places","Tech & AI","Chess","Professional Communication","Cooking & Food","Commonly Confused Words"];

// ── STATE ──
let phase = "sort"; // sort | home | study | done
let bucketData = JSON.parse(localStorage.getItem("speaklear_buckets") || "{}");
let sessionWords = [];
let sortIndex = 0;
let studyQueue = [];
let studyIndex = 0;
let stats = {sorted:0, studied:0, correct:0};
let sortHistory = [];
let sorting = false;
let toastTimer = null;

// Initialize bucket data for any new words
WORDS.forEach(w => { if (!(w.i in bucketData)) bucketData[w.i] = 5; });
saveBuckets();

function saveBuckets(){ localStorage.setItem("speaklear_buckets", JSON.stringify(bucketData)); }

// ── ROUTING ──
function goHome(){ if(phase!=="sort"){phase="home";render();} }

function startSort(){
  // Pick 10 random words, prioritize bucket 5
  let pool = WORDS.filter(w => bucketData[w.i] === 5);
  if(pool.length < 10) pool = [...WORDS];
  sessionWords = shuffle(pool).slice(0,10);
  sortIndex = 0;
  sortHistory = [];
  stats = {sorted:0,studied:0,correct:0};
  phase = "sort";
  render();
}

function startStudy(){
  studyQueue = [];
  for(let b=5;b>=1;b--){
    sessionWords.filter(w=>bucketData[w.i]===b).forEach(w=>{
      const type = b>=4 ? ["pron","mean","fill","ctx"][Math.random()*4|0] : b===3 ? "fill" : b===2 ? "pron" : ["pron","mean","fill","ctx"][Math.random()*4|0];
      studyQueue.push({w, type});
    });
  }
  studyIndex = 0;
  phase = "study";
  render();
}

// ── RENDER ──
function render(){
  const app = document.getElementById("app");
  const nav = document.getElementById("nav");

  // Nav
  if(phase==="sort"){
    nav.innerHTML = "";
  } else {
    nav.innerHTML = `
      <button class="nav-btn ${phase==='home'?'active':''}" onclick="phase='home';render()">◫ Home</button>
      <button class="nav-btn ${phase==='study'?'active':''}" onclick="if(phase!=='study')startStudy()">▶ Study</button>
    `;
  }

  if(phase!=="sort") hideToast();
  if(phase==="sort") renderSort(app);
  else if(phase==="home") renderHome(app);
  else if(phase==="study") renderStudy(app);
  else if(phase==="done") renderDone(app);
}

// ── SORT PHASE ──
function renderSort(el){
  const word = sessionWords[sortIndex];
  if(!word){phase="home";render();return;}
  el.innerHTML = `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;font-weight:700">Sort these words</span>
        <span style="display:flex;align-items:center;gap:10px">
          ${sortHistory.length?`<button class="nav-btn" style="padding:3px 8px" onclick="undoSort()" aria-label="Undo last sort">↶ Undo</button>`:''}
          <span style="font-size:12px;color:var(--muted)">${sortIndex}/${sessionWords.length}</span>
        </span>
      </div>
      <div class="progress-dots">${sessionWords.map((_,i)=>`<div class="progress-dot ${i<sortIndex?'done':i===sortIndex?'current':''}"></div>`).join('')}</div>
    </div>
    <div style="display:flex;flex-direction:column;justify-content:center;min-height:36vh;margin-bottom:8px">
      <div id="sortCard" class="sort-card card-in">
        <div class="drag-handle"></div>
        <div class="sort-word">${word.w}</div>
        <div class="sort-hint">Do you know this word?</div>
      </div>
    </div>
    <div id="bucketInfo" style="position:relative;z-index:110;text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:.02em;min-height:16px">${SORT_HINT}</div>
    <div class="buckets-grid">
      ${SORT_ORDER.map((b,i)=>`
        <button class="bucket" data-bucket="${b.id}" style="border-color:${b.color}40;background:${b.color}08" onclick="sortWith(${b.id})"
          onmouseenter="showBucketInfo(${b.id})" onmouseleave="showBucketInfo(null)" onfocus="showBucketInfo(${b.id})" onblur="showBucketInfo(null)"
          aria-label="${b.label}: ${b.sub}, review ${b.interval.toLowerCase()}" title="${b.label} — ${b.sub}">
          <span class="bucket-emoji">${b.emoji}</span>
          <span class="bucket-label" style="color:${b.color}">${b.short}</span>
          <span class="bucket-interval">${b.interval}</span>
          <span class="bucket-key">${i+1}</span>
        </button>
      `).join('')}
    </div>
  `;
  setupDrag();
}

function showBucketInfo(bid){
  const info = document.getElementById("bucketInfo");
  if(!info) return;
  const b = BUCKETS.find(x=>x.id===bid);
  info.innerHTML = b ? `<span style="color:${b.color};font-weight:600">${b.label}</span> · ${b.sub} · review ${b.interval.toLowerCase()}` : SORT_HINT;
}

// Entry point for taps and keys; drags go through animateToBucket, which sets the lock itself
function sortWith(bucketId){
  if(sorting) return;
  doSort(bucketId);
}

function undoSort(){
  if(sorting || !sortHistory.length) return;
  const last = sortHistory.pop();
  bucketData[last.id] = last.prev;
  saveBuckets();
  stats.sorted--;
  sortIndex--;
  hideToast();
  render();
}

function doSort(bucketId){
  sorting = false;
  const word = sessionWords[sortIndex];
  if(!word) return;
  const bk = BUCKETS.find(b=>b.id===bucketId);
  sortHistory.push({id:word.i, prev:bucketData[word.i]});
  bucketData[word.i] = bucketId;
  saveBuckets();
  stats.sorted++;
  showToast(`${word.w} → ${bk.label}`, bk.color);
  sortIndex++;
  if(sortIndex >= sessionWords.length){
    sorting = true;
    setTimeout(()=>{sorting=false;phase="home";render();}, 400);
  } else {
    render();
  }
}

// ── DRAG & THROW ──
function setupDrag(){
  const card = document.getElementById("sortCard");
  if(!card) return;
  let ds = {on:false,sx:0,sy:0,vx:0,vy:0,lx:0,ly:0,lt:0,ox:0,oy:0};

  card.addEventListener("pointerdown", e=>{
    if(sorting) return;
    e.preventDefault();
    card.setPointerCapture(e.pointerId);
    ds = {on:true,sx:e.clientX,sy:e.clientY,vx:0,vy:0,lx:e.clientX,ly:e.clientY,lt:Date.now(),ox:0,oy:0};
    card.style.transition = "none";
    card.style.zIndex = "100";
  });

  card.addEventListener("pointermove", e=>{
    if(!ds.on) return;
    e.preventDefault();
    const now=Date.now(), dt=Math.max(1,now-ds.lt);
    ds.vx = .7*ds.vx+.3*((e.clientX-ds.lx)/dt)*1000;
    ds.vy = .7*ds.vy+.3*((e.clientY-ds.ly)/dt)*1000;
    ds.lx=e.clientX; ds.ly=e.clientY; ds.lt=now;
    ds.ox = e.clientX-ds.sx; ds.oy = e.clientY-ds.sy;
    card.style.transform = `translate(${ds.ox}px,${ds.oy}px) rotate(${ds.ox*.04}deg) scale(${Math.max(.6,1-Math.max(0,ds.oy)/600)})`;
    card.style.boxShadow = "0 25px 60px rgba(0,0,0,.5)";
    document.getElementById("dropOverlay").style.opacity = Math.min(1, ds.oy/80);

    // Highlight bucket
    document.querySelectorAll(".bucket").forEach(b=>b.classList.remove("hover"));
    const hit = hitTestBucket(e.clientX, e.clientY);
    if(hit){
      const el = document.querySelector(`[data-bucket="${hit}"]`);
      if(el) el.classList.add("hover");
    }
    showBucketInfo(hit);
  });

  card.addEventListener("pointerup", e=>{
    if(!ds.on) return;
    ds.on = false;
    document.getElementById("dropOverlay").style.opacity = "0";
    document.querySelectorAll(".bucket").forEach(b=>b.classList.remove("hover"));
    showBucketInfo(null);

    const hit = hitTestBucket(e.clientX, e.clientY);
    if(hit){ animateToBucket(card, hit); return; }

    const spd = Math.sqrt(ds.vx**2+ds.vy**2);
    if(spd>500 && ds.vy>150){
      const cr = card.getBoundingClientRect();
      const px = cr.left+cr.width/2+ds.vx*.15;
      let best=null, bd=Infinity;
      document.querySelectorAll(".bucket").forEach(b=>{
        const br=b.getBoundingClientRect();
        const d=Math.abs(px-(br.left+br.width/2));
        if(d<bd){bd=d;best=parseInt(b.dataset.bucket);}
      });
      if(best && bd<180){ animateToBucket(card, best); return; }
    }

    // Spring back
    card.style.transition = "all .5s cubic-bezier(.175,.885,.32,1.275)";
    card.style.transform = "translate(0,0) rotate(0) scale(1)";
    card.style.boxShadow = "";
    card.style.zIndex = "";
  });

  card.addEventListener("pointercancel", ()=>{
    ds.on=false;
    document.getElementById("dropOverlay").style.opacity="0";
    document.querySelectorAll(".bucket").forEach(b=>b.classList.remove("hover"));
    showBucketInfo(null);
    card.style.zIndex = "";
    card.style.transition = "all .5s cubic-bezier(.175,.885,.32,1.275)";
    card.style.transform = "translate(0,0) rotate(0) scale(1)";
    card.style.boxShadow = "";
  });
}

function hitTestBucket(cx,cy){
  const buckets = document.querySelectorAll(".bucket");
  for(const b of buckets){
    const r=b.getBoundingClientRect();
    if(cx>=r.left-14 && cx<=r.right+14 && cy>=r.top-14 && cy<=r.bottom+14)
      return parseInt(b.dataset.bucket);
  }
  return null;
}

function animateToBucket(card, bid){
  const bEl = document.querySelector(`[data-bucket="${bid}"]`);
  if(!bEl) return;
  sorting = true;
  const br=bEl.getBoundingClientRect(), cr=card.getBoundingClientRect();
  const tx=br.left+br.width/2-cr.left-cr.width/2;
  const ty=br.top+br.height/2-cr.top-cr.height/2;
  card.style.transition="all .38s cubic-bezier(.2,.8,.2,1)";
  card.style.transform=`translate(${tx}px,${ty}px) scale(.5)`;
  card.style.opacity="0";
  setTimeout(()=>doSort(bid),380);
}

// ── HOME PHASE ──
function renderHome(el){
  const counts = BUCKETS.map(b=>({...b, count: sessionWords.filter(w=>bucketData[w.i]===b.id).length}));
  const unknownCount = sessionWords.filter(w=>bucketData[w.i]===5).length;
  const knownCount = sessionWords.filter(w=>bucketData[w.i]===1).length;
  const totalSorted = sessionWords.length;

  el.innerHTML = `
    <div style="margin-bottom:24px" class="slide-up">
      <div style="font-size:20px;font-weight:800;margin-bottom:4px">Ready to study? 📚</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.5">You sorted ${stats.sorted} words. Review your buckets below, then start studying when you're ready.</div>
    </div>
    <div class="stat-grid slide-up">
      <div class="stat-card"><div class="stat-val" style="color:var(--accent)">${knownCount}</div><div class="stat-lbl">Known</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--warm)">${totalSorted-knownCount-unknownCount}</div><div class="stat-lbl">Practising</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--red)">${unknownCount}</div><div class="stat-lbl">Unknown</div></div>
    </div>
    <div class="section-title">Your Buckets</div>
    ${counts.map(b=>`
      <div class="bucket-row">
        <div class="bucket-icon" style="background:${b.color}10;border:1px solid ${b.color}20">${b.emoji}</div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:13px;font-weight:600;color:${b.color}">${b.label}</span>
            <span style="font-size:18px;font-weight:800">${b.count}</span>
          </div>
          <div style="font-size:11px;color:var(--dim)">${b.sub} · ${b.interval}</div>
          <div style="height:2px;background:rgba(255,255,255,.04);border-radius:1px;margin-top:5px">
            <div style="height:100%;border-radius:1px;background:${b.color};width:${totalSorted>0?(b.count/totalSorted*100):0}%;transition:width .4s"></div>
          </div>
        </div>
      </div>
    `).join('')}
    <div class="section-title" style="margin-top:24px">Words This Session</div>
    <div class="word-tags">
      ${sessionWords.map(w=>{
        const bk=BUCKETS.find(b=>b.id===bucketData[w.i])||BUCKETS[4];
        return `<div class="word-tag" style="background:${bk.color}0c;border:1px solid ${bk.color}18">${w.w}<span class="word-tag-dev">${w.d}</span><span style="color:${bk.color};font-size:10px">${bk.emoji}</span></div>`;
      }).join('')}
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
      <button class="btn-primary" onclick="startStudy()">Start Study Session →</button>
      <button class="btn-secondary" onclick="startSort()">Sort New Words Instead</button>
    </div>
  `;
}

// ── STUDY PHASE ──
function renderStudy(el){
  if(studyIndex >= studyQueue.length){phase="done";render();return;}
  const {w, type} = studyQueue[studyIndex];
  el.innerHTML = `
    <div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:13px;font-weight:700">Study session</span>
        <span style="font-size:12px;color:var(--muted)">${studyIndex+1}/${studyQueue.length}</span>
      </div>
      <div class="progress-dots">${studyQueue.map((_,i)=>`<div class="progress-dot ${i<studyIndex?'study-done':i===studyIndex?'study-current':''}"></div>`).join('')}</div>
    </div>
    <div id="studyCard" class="slide-up">${renderStudyCard(w, type)}</div>
  `;
}

function renderStudyCard(w, type){
  if(type==="pron") return renderPron(w);
  if(type==="mean") return renderMean(w);
  if(type==="fill") return renderFill(w);
  return renderCtx(w);
}

function renderPron(w){
  return `
    <div class="study-card" style="border-left:3px solid var(--warm)">
      <div class="study-tag" style="color:var(--warm);background:var(--warm-soft)">🗣 Pronunciation</div>
      <div class="study-word">${w.w}</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:16px">How do you pronounce this?</div>
      <div id="studyReveal">
        <button class="reveal-btn" onclick="revealPron(${JSON.stringify(w).replace(/"/g,'&quot;')})">Reveal pronunciation</button>
      </div>
    </div>`;
}

function revealPron(w){
  document.getElementById("studyReveal").innerHTML = `
    <div class="fade-in">
      <div class="ipa" style="font-size:14px;margin-bottom:4px">${w.p}</div>
      <div class="stress" style="font-size:17px;margin-bottom:12px">${w.n||''}</div>
      <div class="devanagari" style="font-size:26px;margin-bottom:12px">${w.d}</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="action-btn" style="background:var(--accent-soft);color:var(--accent);border-color:var(--accent-glow)" onclick="studyNext('ok')">Got it ✓</button>
        <button class="action-btn" style="background:var(--red-soft);color:var(--red);border-color:#e8545430" onclick="studyNext('no')">Still hard</button>
      </div>
    </div>`;
}

function renderMean(w){
  return `
    <div class="study-card" style="border-left:3px solid var(--purple)">
      <div class="study-tag" style="color:var(--purple);background:var(--purple-soft)">🤔 Meaning</div>
      <div class="study-word">${w.w}</div>
      <div class="ipa" style="font-size:13px;margin-bottom:16px">${w.p}</div>
      <div id="studyReveal">
        <button class="reveal-btn" onclick="revealMean(${JSON.stringify(w).replace(/"/g,'&quot;')})">Reveal meaning</button>
      </div>
    </div>`;
}

function revealMean(w){
  document.getElementById("studyReveal").innerHTML = `
    <div class="fade-in">
      <div style="font-size:14px;color:#d1d5db;margin-bottom:12px;line-height:1.6">${w.e}</div>
      <div style="display:flex;gap:20px;margin-bottom:12px">
        <div><span class="lang-label">मराठी</span><span style="font-size:13px;font-family:'Noto Sans Devanagari';color:#9ca3af">${w.m}</span></div>
        <div><span class="lang-label">日本語</span><span style="font-size:13px;color:#9ca3af">${w.j}</span></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="action-btn" style="background:var(--accent-soft);color:var(--accent);border-color:var(--accent-glow)" onclick="studyNext('ok')">Got it ✓</button>
        <button class="action-btn" style="background:var(--red-soft);color:var(--red);border-color:#e8545430" onclick="studyNext('no')">Still hard</button>
      </div>
    </div>`;
}

function renderFill(w){
  if(!w.s) return renderPron(w); // fallback if no sentence
  const parts = w.s.split("_____");
  return `
    <div class="study-card" style="border-left:3px solid var(--blue)">
      <div class="study-tag" style="color:var(--blue);background:var(--blue-soft)">✍ Fill in the blank</div>
      <div style="font-size:14px;color:#d1d5db;line-height:1.8;margin-top:8px;margin-bottom:16px">
        ${parts[0]}<input id="fillInput" type="text" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:4px 10px;color:#f9fafb;font-size:14px;font-family:'Outfit';width:${Math.max(80,w.w.length*12)}px" placeholder="type..." onkeydown="if(event.key==='Enter')checkFill(${JSON.stringify(w).replace(/"/g,'&quot;')})">${parts[1]||''}
      </div>
      <div id="studyReveal">
        <button class="reveal-btn" onclick="checkFill(${JSON.stringify(w).replace(/"/g,'&quot;')})">Check answer</button>
      </div>
    </div>`;
}

function checkFill(w){
  const input = document.getElementById("fillInput");
  if(!input) return;
  const val = input.value.trim();
  if(!val) return;
  const ok = val.toLowerCase() === w.w.toLowerCase();
  document.getElementById("studyReveal").innerHTML = `
    <div class="fade-in">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:22px">${ok?'✅':'❌'}</span>
        <span style="font-size:13px;color:${ok?'var(--accent)':'var(--red)'};font-weight:600">${ok?'Correct!':`Answer: ${w.w}`}</span>
      </div>
      <div class="stress" style="font-size:13px;margin-bottom:3px">${w.n||''}</div>
      <div class="devanagari" style="font-size:20px;margin-bottom:12px">${w.d}</div>
      <button class="action-btn" style="background:var(--blue-soft);color:var(--blue);border-color:#4b8ef530;width:100%" onclick="studyNext('${ok?'ok':'no'}')">Next →</button>
    </div>`;
  // Also update the input display
  if(input){
    input.disabled = true;
    input.style.color = ok ? 'var(--accent)' : 'var(--red)';
    input.style.borderColor = ok ? 'var(--accent)' : 'var(--red)';
    if(!ok) input.value = `${val} → ${w.w}`;
  }
}

function renderCtx(w){
  return `
    <div class="study-card" style="border-left:3px solid var(--accent)">
      <div class="study-tag" style="color:var(--accent);background:var(--accent-soft)">📖 Context</div>
      <div class="study-word">${w.w}</div>
      <div class="stress" style="font-size:13px;margin-bottom:3px">${w.n||''}</div>
      <div class="devanagari" style="font-size:22px;margin-bottom:14px">${w.d}</div>
      <div id="studyReveal">
        <button class="reveal-btn" onclick="revealCtx(${JSON.stringify(w).replace(/"/g,'&quot;')})">Show in a sentence</button>
      </div>
    </div>`;
}

function revealCtx(w){
  document.getElementById("studyReveal").innerHTML = `
    <div class="fade-in">
      <div style="font-size:14px;color:#e5e7eb;line-height:1.7;padding:12px 14px;background:rgba(18,196,140,.04);border-radius:10px;border-left:2px solid var(--accent);margin-bottom:10px">${w.sf||w.s||''}</div>
      <div style="font-size:12px;color:#9ca3af;margin-bottom:12px">${w.e}</div>
      <button class="action-btn" style="background:var(--accent-soft);color:var(--accent);border-color:var(--accent-glow);width:100%" onclick="studyNext('ok')">Next →</button>
    </div>`;
}

function studyNext(result){
  if(result==='ok') stats.correct++;
  stats.studied++;
  studyIndex++;
  if(studyIndex >= studyQueue.length){phase="done";render();}
  else render();
}

// ── DONE PHASE ──
function renderDone(el){
  const pct = stats.studied>0 ? Math.round(stats.correct/stats.studied*100) : 0;
  el.innerHTML = `
    <div style="text-align:center;padding:40px 0" class="slide-up">
      <div style="font-size:50px;margin-bottom:14px">🎉</div>
      <div style="font-size:22px;font-weight:800;margin-bottom:6px">Session Complete!</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:28px">Consistency is what matters. Great job today.</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-val" style="color:var(--accent)">${stats.sorted}</div><div class="stat-lbl">Sorted</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--blue)">${stats.studied}</div><div class="stat-lbl">Studied</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--warm)">${pct}%</div><div class="stat-lbl">Score</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <button class="btn-primary" onclick="startSort()">Start New Session →</button>
        <button class="btn-secondary" onclick="phase='home';render()">← Back to Home</button>
      </div>
    </div>`;
}

// ── UTILITIES ──
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function showToast(text, color){
  const t=document.getElementById("toast");
  t.style.display="block";
  t.style.borderColor=(color||'var(--accent)')+'30';
  t.innerHTML=text;
  t.style.animation="none";
  t.offsetHeight; // reflow
  t.style.animation="toastIn .25s ease";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 2000);
}

function hideToast(){
  clearTimeout(toastTimer);
  document.getElementById("toast").style.display="none";
}

// Keyboard shortcuts
document.addEventListener("keydown", e=>{
  if(phase==="sort" && e.key>="1" && e.key<="5") sortWith(SORT_ORDER[parseInt(e.key)-1].id);
});

// ── BOOT ──
startSort();
</script>
